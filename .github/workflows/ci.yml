name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same checks before building anything.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  core:
    name: Core — crypto & protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/core test
      - name: Coverage stays above the floor
        run: pnpm --dir packages/core run test:coverage
      - run: pnpm --dir packages/core run test:federation

  app:
    name: App — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/app exec tsc --noEmit -p .
      - run: pnpm --dir packages/app test
      - run: pnpm --dir packages/app exec vite build

  relay:
    name: Relay — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/relay build
      - run: pnpm --dir packages/relay test

  relay-tunnel:
    name: Relay — hosting without port forwarding (scripts/relay-tunnel.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The relay's own address stands in for a tunnel URL: the script starts
      # docker-compose.tunnel.yml and checks /relay-info through that URL.
      - run: scripts/relay-tunnel.sh url http://127.0.0.1:3001
      - run: scripts/relay-tunnel.sh status
      - name: Real clients through the single port
        working-directory: packages/core
        run: |
          pnpm run build
          node --loader ./sodium-loader.mjs --import ./sodium-loader.mjs scripts/relay-load.mjs \
            --relay http://127.0.0.1:3001 --clients 20 --rate 5 --fanout 3 --msgs 2
      - name: Only the API port is published
        run: "! curl -s --max-time 3 http://127.0.0.1:3000/"
      - run: scripts/relay-tunnel.sh stop

  secrets:
    name: Secrets — nothing private in the history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # the scan reads every commit
      # Reviewed false positives are listed in .gitleaksignore.
      - run: scripts/secret-scan.sh

  audit:
    name: Dependencies — known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      # No install here (audit reads the lockfile), so no pnpm cache: its
      # post-job save fails on the store directory that never gets created.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: pnpm audit --prod --audit-level high

  site:
    name: Website — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/site run lint
      - run: pnpm --dir packages/site build

  tools:
    name: CLI, push proxy, admin & desktop — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --dir packages/core build
      - run: pnpm --dir packages/cli build
      - run: pnpm --dir packages/push-proxy build
      - run: pnpm --dir packages/admin build
      - run: pnpm --dir packages/desktop exec tsc --noEmit -p .

  lab:
    name: Lab — real relay, browsers driving the UI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker compose -f tests/lab/docker-compose.yml build
      - run: tests/lab/scripts/profile-up.sh lan
      - name: Core protocol checks
        run: docker compose -f tests/lab/docker-compose.yml run --rm core
      - name: Messaging, files, offline delivery, ordering, relay restart, group churn, 10-member groups
        run: docker compose -f tests/lab/docker-compose.yml run --rm runner pnpm --dir tests/lab test
      - name: UI smoke and transport
        run: docker compose -f tests/lab/docker-compose.yml run --rm runner pnpm --dir tests/lab test:ui
      - name: Relay log
        if: failure()
        run: docker compose -f tests/lab/docker-compose.yml logs --tail 300 relay
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: lab-artifacts
          path: tests/lab/artifacts
          if-no-files-found: ignore
      - if: always()
        run: docker compose -f tests/lab/docker-compose.yml down --remove-orphans
