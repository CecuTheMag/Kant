name: Apple

# Builds and tests the macOS and iOS apps on GitHub's macOS runners (real Apple
# hardware with Xcode). Run it by hand (Actions → Apple → Run workflow) or by
# pushing to a branch named apple*. The release workflow runs the same macOS
# build for tagged releases.

on:
  workflow_dispatch:
  push:
    branches: ['apple*']

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

env:
  # Baked into the builds as the default network; tests don't depend on it.
  VITE_RELAY_URL: https://majesticrelay.duckdns.org

jobs:
  macos:
    name: macOS app
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/desktop run build:mac
      - name: Signatures are valid (ad-hoc; no Developer ID)
        run: |
          ls -la packages/desktop/release
          for app in packages/desktop/release/mac/Kant.app packages/desktop/release/mac-arm64/Kant.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E "Signature|Identifier|Format"
            lipo -archs "$app/Contents/MacOS/Kant"
          done
      - name: Smoke test, Apple Silicon (app starts, bundled relay healthy, UI renders)
        run: node packages/desktop/scripts/smoke.mjs packages/desktop/release/mac-arm64/Kant.app/Contents/MacOS/Kant
      - name: Smoke test, Intel under Rosetta
        env:
          # Rosetta translates the whole app on first launch (over a minute).
          KANT_SMOKE_TIMEOUT_MS: '300000'
        run: |
          /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license
          node packages/desktop/scripts/smoke.mjs packages/desktop/release/mac/Kant.app/Contents/MacOS/Kant
      - name: A downloaded copy opens past Gatekeeper's prompt, not "damaged"
        run: |
          dmg=$(ls packages/desktop/release/Kant-*-mac-arm64.dmg)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          cp -R "$mnt/Kant.app" "$RUNNER_TEMP/"
          hdiutil detach "$mnt"
          xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;" "$RUNNER_TEMP/Kant.app"
          # A broken seal is what makes macOS say "damaged"; a valid ad-hoc
          # signature gets the "could not verify" prompt with Open Anyway.
          codesign --verify --deep --strict "$RUNNER_TEMP/Kant.app"
          spctl --assess --type execute -vv "$RUNNER_TEMP/Kant.app" 2>&1 | tee "$RUNNER_TEMP/spctl.txt" || true
          ! grep -qi "damaged\|invalid signature\|a sealed resource is missing" "$RUNNER_TEMP/spctl.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: packages/desktop/release/Kant-*-mac-*.dmg
          if-no-files-found: error

  ios:
    name: iOS app
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SIM: iPhone 16
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Local relay for the tests
        # Single-port layout (RELAY_PUBLIC_URL), as behind a tunnel or Caddy:
        # the app reaches libp2p through the API port; port 3000 is loopback-only.
        run: |
          pnpm --dir packages/relay build
          mkdir -p "$RUNNER_TEMP/relay"
          RELAY_PORT=3000 RELAY_INFO_PORT=3001 RELAY_PUBLIC_URL=http://127.0.0.1:3001 RELAY_HTTP_BIND=127.0.0.1 RELAY_WS_BIND=127.0.0.1 \
            RELAY_DATA_DIR="$RUNNER_TEMP/relay" nohup node packages/relay/dist/index.js > "$RUNNER_TEMP/relay.log" 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:3001/healthz && break; sleep 1; done
      - name: Web app without a default relay (the test connects to the local one)
        env:
          VITE_RELAY_URL: ''
        run: pnpm --dir packages/app run build
      - run: pnpm --dir packages/app exec cap sync ios
      - run: ruby packages/app/ios/scripts/add-ui-tests.rb
      - name: Simulator with Face ID enrolled
        run: |
          xcrun simctl list devices available | grep -E "iPhone" | head -5
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl spawn "$SIM" notifyutil -s com.apple.BiometricKit.enrollmentChanged 1
          xcrun simctl spawn "$SIM" notifyutil -p com.apple.BiometricKit.enrollmentChanged
      - name: Web client to talk to (same relay)
        run: |
          pnpm --dir tests/lab exec playwright install chromium
          nohup node tests/lab/local/ios-peer.mjs http://127.0.0.1:3001 "$RUNNER_TEMP/peer-link.txt" > "$RUNNER_TEMP/peer.log" 2>&1 &
          for i in $(seq 120); do [ -s "$RUNNER_TEMP/peer-link.txt" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/peer-link.txt"
          echo "TEST_RUNNER_KANT_PEER_LINK=$(cat "$RUNNER_TEMP/peer-link.txt")" >> "$GITHUB_ENV"
      - name: UI tests in the iOS Simulator
        env:
          TEST_RUNNER_KANT_TEST_RELAY: http://127.0.0.1:3001
        run: |
          # Signed "to run locally" (free, no Apple account) rather than unsigned:
          # without a signature the app has no Keychain entitlement, which real
          # installs (App Store or sideloaded) always have.
          # Answer every Face ID prompt with a matching face while the tests run.
          (while true; do xcrun simctl spawn "$SIM" notifyutil -p com.apple.BiometricKit_Sim.pearl.match; sleep 2; done) &
          status=0
          xcodebuild test \
            -workspace packages/app/ios/App/App.xcworkspace -scheme KantUITests \
            -destination "platform=iOS Simulator,name=$SIM" \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || status=$?
          grep -E "error:|Test Case .*(passed|failed)|Executed [0-9]+ test|KANT-LAUNCH" "$RUNNER_TEMP/xcodebuild.log" || tail -80 "$RUNNER_TEMP/xcodebuild.log"
          exit $status
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p ios-shots
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui.xcresult" --output-path ios-shots || true
          cp "$RUNNER_TEMP/relay.log" "$RUNNER_TEMP/peer.log" "$RUNNER_TEMP/xcodebuild.log" ios-shots/ || true
          xcrun simctl spawn "$SIM" log show --last 30m --style compact \
            --predicate 'subsystem == "com.kant.messenger" OR (process == "securityd" AND eventMessage CONTAINS[c] "kant")' \
            > ios-shots/app-log.txt 2>&1 || true
          ls -la ios-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: ios-shots
      - name: Release build with the default relay (unsigned .ipa, for sideloading)
        run: |
          pnpm --dir packages/app run build
          pnpm --dir packages/app exec cap sync ios
          version=$(node -p "require('./packages/app/package.json').version")
          xcodebuild archive \
            -workspace packages/app/ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/Kant.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tail -30
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/Kant.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Kant-$version.ipa" Payload)
          ls -la Kant-*.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: Kant-*.ipa
          if-no-files-found: error
