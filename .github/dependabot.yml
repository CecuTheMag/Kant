# Dependency updates, opened as pull requests so CI checks each one.
# Security updates arrive as soon as an advisory is published; the weekly
# schedule below is for routine version bumps.
#
# Routine updates are minor and patch versions only, grouped so a week brings a
# handful of PRs. Major versions (a new TypeScript, Capacitor, Node, Gradle...)
# change behaviour and are upgraded deliberately, by hand, with a release.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # libp2p packages must move together: their interfaces are versioned as a set.
      libp2p:
        patterns: ["libp2p", "@libp2p/*", "@multiformats/*"]
      capacitor:
        patterns: ["@capacitor/*"]
      electron:
        patterns: ["electron", "electron-builder"]
      dev-tools:
        dependency-type: development
      everything-else:
        dependency-type: production
    ignore:
      # Crypto: upgrade deliberately, with the test vectors, never automatically.
      - dependency-name: "libsodium-wrappers*"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories:
      - /packages/relay
      - /packages/push-proxy
      - /
    schedule:
      interval: weekly
    ignore:
      # Node: stay on the LTS line the relays run (22); move to the next LTS by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    directory: /packages/app/android
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
