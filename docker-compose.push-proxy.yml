services:
  push-proxy:
    build:
      context: packages/push-proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PUSH_PROXY_PORT:-3002}:4001"
    volumes:
      - ./.kant-secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
      - push-proxy-data:/data
    environment:
      PUSH_PROXY_BIND: "0.0.0.0"
      PUSH_PROXY_PORT: "4001"
      PUSH_PROXY_SECRET: "${PUSH_PROXY_SECRET:?Set PUSH_PROXY_SECRET to a long shared secret}"
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID to your Firebase project ID}"
      FIREBASE_SERVICE_ACCOUNT_FILE: "/run/secrets/firebase-service-account.json"
      PUSH_PROXY_DATA_FILE: "/data/tokens.json"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  push-proxy-data:
